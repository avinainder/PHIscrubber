name: Bug report
description: Over-redaction, a broken control, or a file that will not open
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real patient information.** Use an invented example.
        If text can leave the page, report it privately instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps or invented text that reproduce it
      render: text
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 142 on macOS
    validations:
      required: true
  - type: input
    id: hosting
    attributes:
      label: How the page is served
      placeholder: python3 dev-server.py, GitHub Pages, internal server
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: Every name, number and place in this issue is invented.
          required: true
