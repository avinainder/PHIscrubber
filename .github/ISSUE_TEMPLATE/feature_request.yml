name: Feature request
description: Suggest a new rule, note format or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real patient information.** Use an invented example.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Invented example, if it applies
      render: text
